<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityFlow — Agente Rutas IA</title>
  <meta name="description" content="Encuentra la mejor ruta en autobús con nuestro Agente IA que sincroniza con la EMT en tiempo real.">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    .ia-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 992px) {
      .ia-container { grid-template-columns: 350px 1fr; }
    }
    
    .ia-chat-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .ia-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }
    
    .ia-response {
      background: rgba(99,102,241,0.1);
      border-left: 4px solid #6366f1;
      padding: 1rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--fg);
      white-space: pre-line;
      display: none; /* hidden until result */
    }
    
    .ia-response strong { color: #f1f5f9; }
    
    .map-container {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 500px;
      overflow: hidden;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted-fg);
      font-weight: 500;
    }
    
    .custom-icon-orig { background: #22c55e; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); width: 14px; height: 14px; }
    .custom-icon-dest { background: #ef4444; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); width: 14px; height: 14px; }
    .custom-icon-bus { background: #3b9ed4; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); width: 14px; height: 14px; display:flex; align-items:center; justify-content:center; font-size:8px;}
  </style>
</head>
<body>
<button class="btn-menu-toggle" id="menu-toggle">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-header" style="margin-bottom: 1.5rem">
      <h1 class="page-title" style="display:flex; align-items:center; gap:0.75rem">
        <span style="font-size:1.8rem"></span> Agente de Rutas IA
      </h1>
      <p class="page-subtitle">Describe adónde quieres ir y sincronizaré con la red EMT para darte la ruta más rápida.</p>
    </div>
    
    <div class="ia-container">
      <div class="ia-chat-box">
        <div style="display:flex; align-items:center; gap:1rem; margin-bottom: 0.5rem">
          <div class="ia-avatar">🤖</div>
          <div>
            <div style="font-weight:700; font-family:'Space Grotesk',sans-serif">CityFlow AI</div>
            <div style="font-size:0.8rem; color:var(--success)">En línea</div>
          </div>
        </div>

        <form id="ia-form" style="display:flex; flex-direction:column; gap:1rem">
          <div class="form-group">
            <label for="origin">¿Dónde estás?</label>
            <input type="text" id="origin" class="form-input" placeholder="Ej. Puerta del Sol, Madrid" required value="Puerta del Sol, Madrid">
          </div>
          <div class="form-group">
            <label for="destination">¿Adónde vas?</label>
            <input type="text" id="destination" class="form-input" placeholder="Ej. Retiro, Madrid" required value="Parque del Retiro, Madrid">
          </div>
          <button type="submit" class="btn btn-primary" id="btn-submit" style="width:100%; justify-content:center; margin-top:0.5rem">
            Calcular Ruta 
          </button>
        </form>

        <div id="ia-response" class="ia-response animate-in"></div>
      </div>
      
      <div class="map-container" id="route-map"></div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/nav.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  requireAuth();
  
  let map = null;
  let layerGroup = null;

  function initMap() {
    map = L.map('route-map').setView([40.4168, -3.7038], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© CARTO · Datos EMT Madrid',
      maxZoom: 19,
    }).addTo(map);
    layerGroup = L.layerGroup().addTo(map);
  }

  document.addEventListener('DOMContentLoaded', () => {
    initMap();

    const form = document.getElementById('ia-form');
    const btn = document.getElementById('btn-submit');
    const responseBox = document.getElementById('ia-response');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const origin = document.getElementById('origin').value;
      const destination = document.getElementById('destination').value;
      
      if (!origin || !destination) return;

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin-right:8px"></div> Procesando...';
      responseBox.style.display = 'none';
      layerGroup.clearLayers();

      try {
        const res = await api.post('/ai/route', { origin, destination });
        
        responseBox.style.display = 'block';
        // Basic markdown formatting (bold)
        let formattedMsg = res.message.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        responseBox.innerHTML = formattedMsg;

        if (!res.error && res.routeData) {
          drawRoute(res.routeData);
        } else {
          Toast.error(res.message);
        }

      } catch (err) {
        responseBox.style.display = 'block';
        responseBox.innerHTML = '🤖 <strong>Lo siento</strong>, mis circuitos están sobrecargados y no pude calcular la ruta.';
        Toast.error(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Calcular Ruta Mágica ✨';
      }
    });
  });

  function drawRoute(data) {
    layerGroup.clearLayers();
    
    const { origin, destination, line, originStop, destStop } = data;

    // Icons
    const iconOrig = L.divIcon({ className: 'custom-icon-orig', iconSize: [14, 14], iconAnchor: [7, 7] });
    const iconDest = L.divIcon({ className: 'custom-icon-dest', iconSize: [14, 14], iconAnchor: [7, 7] });
    const iconBus = L.divIcon({ className: 'custom-icon-bus', html: '🚏', iconSize: [16, 16], iconAnchor: [8, 8] });

    // Markers
    const mOrig = L.marker([origin.lat, origin.lng], { icon: iconOrig }).bindPopup('Origen: ' + origin.displayName).addTo(layerGroup);
    const mDest = L.marker([destination.lat, destination.lng], { icon: iconDest }).bindPopup('Destino: ' + destination.displayName).addTo(layerGroup);
    
    const mStopOrig = L.marker([originStop.lat, originStop.lng], { icon: iconBus }).bindPopup('Subir: ' + originStop.name).addTo(layerGroup);
    const mStopDest = L.marker([destStop.lat, destStop.lng], { icon: iconBus }).bindPopup('Bajar: ' + destStop.name).addTo(layerGroup);

    // Polylines
    // Walk to origin stop
    L.polyline([[origin.lat, origin.lng], [originStop.lat, originStop.lng]], {
      color: '#94a3b8', weight: 3, dashArray: '5, 5', opacity: 0.8
    }).addTo(layerGroup);

    // Bus Route (straight line approx for now, ideally we'd fetch the exact geometry but this works for demo)
    L.polyline([[originStop.lat, originStop.lng], [destStop.lat, destStop.lng]], {
      color: '#6366f1', weight: 4, opacity: 0.9
    }).bindTooltip('Línea ' + line, { permanent: true, direction: 'center', className: 'dark-popup' }).addTo(layerGroup);

    // Walk to destination
    L.polyline([[destStop.lat, destStop.lng], [destination.lat, destination.lng]], {
      color: '#94a3b8', weight: 3, dashArray: '5, 5', opacity: 0.8
    }).addTo(layerGroup);

    // Fit bounds
    const bounds = L.latLngBounds([
      [origin.lat, origin.lng],
      [destination.lat, destination.lng],
      [originStop.lat, originStop.lng],
      [destStop.lat, destStop.lng]
    ]);
    map.fitBounds(bounds, { padding: [50, 50] });
  }
</script>
</body>
</html>
